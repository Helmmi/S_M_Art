<!DOCTYPE html>
<html>
<head>
  <title>Digital Art Registry</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
  <script src="abi.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <h1>Register New Art</h1>
  <input type="text" id="title" placeholder="Art Title" />
  <input type="text" id="artist" placeholder="Artist Name" />
  <input type="text" id="imageHash" placeholder="Image Hash (bytes32)" />
  <button onclick="registerArt()">Register</button>

  <h2>All Registered Artworks</h2>
  <button onclick="getAllArts()">Load Artworks</button>
  <ul id="artList"></ul>
</body>
</html>
